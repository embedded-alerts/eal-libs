[package]
org = "embedded-alerts"
name = "eal-libs"
version = "0.1.0"
description = "Shared contracts and runtime-light libraries for Embedded Alerts"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/embedded-alerts/eal-libs"

[install]
dir = ".vendor/.zed"

[dependencies]
"embedded-alerts/eal-interfaces" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "target/**", "dist/**", "*.log", ".vendor/.zed/**"]

[scripts]
test = "bash scripts/test.sh"
